<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quraan-Pro</title>

<!-- AUTO REDIRECT -->
<meta http-equiv="refresh" content="4;url=home.html">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* BASE */
body{
 margin:0;
 height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 font-family:Segoe UI, sans-serif;
 color:#fff;
 overflow:hidden;

 background:
 radial-gradient(circle at 50% 40%, rgba(255,215,0,0.08), transparent 60%),
 linear-gradient(-45deg,#000,#0a0a0a,#111,#000);

 background-size:400% 400%;
 animation:bgMove 12s ease infinite;
}
/* BACKGROUND FLOW */
@keyframes bgMove{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

/* PARTICLES */
body::before{
 content:"";
 position:absolute;
 width:200%;
 height:200%;
 background:
 radial-gradient(circle at 20% 30%, rgba(255,215,0,0.08) 2px, transparent 3px),
 radial-gradient(circle at 70% 60%, rgba(255,215,0,0.06) 2px, transparent 3px),
 radial-gradient(circle at 40% 80%, rgba(255,215,0,0.05) 2px, transparent 3px);
 animation:float 20s linear infinite;
}

/* FLOAT ANIMATION */
@keyframes float{
 from{transform:translateY(0)}
 to{transform:translateY(-200px)}
}

/* MAIN */
.container{
 text-align:center;
 z-index:2;
 animation:fadeIn 1.5s ease;
}

/* ICON */
.icon{
 font-size:70px;
 margin-bottom:15px;
 animation:pop 1s ease;
}

/* TITLE */
h1{
 margin:0;
 font-size:36px;
 color:gold;
 letter-spacing:1px;
 animation:slideUp 1.2s ease;
 text-shadow:0 0 15px rgba(255,215,0,0.5);
}

/* SHIMMER TEXT */
.tagline{
 margin-top:10px;
 font-size:14px;
 background:linear-gradient(90deg,#aaa,#fff,#aaa);
 background-size:200%;
 -webkit-background-clip:text;
 -webkit-text-fill-color:transparent;
 animation:shine 3s linear infinite;
}

/* LOADER */
.loader{
 margin-top:25px;
 display:flex;
 justify-content:center;
 gap:8px;
}

.dot{
 width:10px;
 height:10px;
 background:gold;
 border-radius:50%;
 animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}

/* STATUS TEXT */
.status{
 margin-top:15px;
 font-size:12px;
 opacity:0.6;
 animation:fadeIn 3s ease;
}

/* BUTTON */
.btn{
 display:inline-block;
 margin-top:25px;
 padding:12px 20px;
 background:gold;
 color:#000;
 text-decoration:none;
 border-radius:10px;
 font-weight:bold;
 transition:0.3s;
 animation:fadeIn 3s ease;
}

.btn:hover{
 transform:scale(1.05);
 background:#ffd700;
}

/* ANIMATIONS */
@keyframes fadeIn{
 from{opacity:0}
 to{opacity:1}
}

@keyframes slideUp{
 from{transform:translateY(20px); opacity:0}
 to{transform:translateY(0); opacity:1}
}

@keyframes pop{
 0%{transform:scale(0)}
 80%{transform:scale(1.2)}
 100%{transform:scale(1)}
}

@keyframes bounce{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-10px)}
}

@keyframes shine{
 0%{background-position:0%}
 100%{background-position:200%}
}
</style>
</head>

<body>

<div class="container">

<div class="icon">🕌</div>

<h1>Quraan-Pro</h1>

<div class="tagline">
Read the Qur’an with clarity & beauty
</div>

<!-- LOADER -->
<div class="loader">
<div class="dot"></div>
<div class="dot"></div>
<div class="dot"></div>
</div>

<div class="status">
Opening Home...
</div>

<!-- MANUAL BUTTON -->
<a href="home.html" class="btn">Enter Now</a>

</div>

</body>
</html>
