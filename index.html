<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quraan Pro – Read, Listen & Learn Quran</title>

<meta property="og:title" content="Quraan Pro – Quran Reader App">
<meta name="twitter:title" content="Quraan Pro – Quran Reader App">
 <meta name="description" content="Quraan Pro is a modern Quran app with audio recitation, tafseer, bookmarks, tajweed colors, and prayer tools. Read, listen, and learn easily.">
  <meta property="og:description" content="Read and listen to the Holy Quran with tafseer, bookmarks, tajweed, and smart features in Quraan Pro.">

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" onclick="closePanels()"></div>

<!-- TOP BAR -->
<div class="top">
 <button onclick="toggleSidebar()">☰</button>
 <button onclick="toggleTajweed()">🧠</button>
 <button onclick="openGoto()">🎯</button>
 <button onclick="openSettings()">⚙</button>
 <button onclick="showLegend()">📖</button>
 <button onclick="getNamaz()">🕌</button>
 <button onclick="openCompass()">🧭</button>
 <button onclick="installApp()">📱</button>
<a href="help.html" target="_blank">
  <button>❓ HELP</button>
</a>
 <button onclick="window.open('updates.html')">🆕 Updates</button>
</div>

<!-- SEARCH -->
<input placeholder="Search surah..." oninput="searchSurah(this.value)">

<!-- SIDEBAR -->
<div id="sidebar"></div>

<!-- MAIN CONTENT -->
<div id="content">
 <h2 style="text-align:center;">Select a Surah</h2>
</div>

<!-- SETTINGS PANEL -->
<div id="overlay" onclick="closeSettings()"></div>

<div id="settingsPanel" class="panel">

<h2>⚙ Settings</h2>

<!-- TABS -->
<div class="tabs">
<button onclick="openTab('audioTab')">🎧</button>
<button onclick="openTab('readingTab')">📖</button>
<button onclick="openTab('uiTab')">🎨</button>
<button onclick="openTab('advancedTab')">⚙</button>
</div>

<!-- AUDIO -->
<div id="audioTab" class="tab">
<h3>Audio</h3>

<label>Speed</label>
<select id="speedSelect">
<option value="1">1x</option>
<option value="1.5">1.5x</option>
<option value="2">2x</option>
</select>

<label>Auto Next</label>
<input type="checkbox" id="autoNext">

<label>Loop Count</label>
<input type="number" id="loopCount" min="1" max="10">

</div>

<!-- READING -->
<div id="readingTab" class="tab">
<h3>Reading</h3>

<label>Arabic Size</label>
<input type="range" id="arabicSize" min="20" max="40">

<label>Show Translation</label>
<input type="checkbox" id="showTrans">

</div>

<!-- UI -->
<div id="uiTab" class="tab">
<h3>UI</h3>

<label>Theme</label>
<select id="themeSelect">
<option value="theme-dark">Dark</option>
<option value="theme-light">Light</option>
<option value="theme-blue">Blue</option>
<option value="theme-green">Green</option>
<option value="theme-purple">Purple</option>
<option value="theme-gold">Kaaba</option>
</select>

</div>

<!-- ADVANCED -->
<div id="advancedTab" class="tab">
<h3>Advanced</h3>

<label>Tajweed</label>
<input type="checkbox" id="tajweedToggle">

<label>Auto Save</label>
<input type="checkbox" id="autoSave">

<button onclick="resetSettings()">Reset All</button>

</div>

<br>
<button onclick="closeSettings()">Close</button>

</div>
<!-- GOTO PANEL -->
<div id="goto" class="panel">
<h3>Go To</h3>
Surah: <input id="suraInput"><br><br>
Ayah: <input id="ayahInput"><br><br>
<button onclick="goToAyah()">Go</button>
<button onclick="closePanels()">Close</button>
</div>

<!-- LEGEND -->
<div id="legend" class="panel">
<h3>Tajweed Legend</h3>
<p class="madd">Madd</p>
<p class="qalqala">Qalqalah</p>
<p class="ikhfa">Ikhfa</p>
<p class="idgham">Idgham</p>
<p class="iqlab">Iqlab</p>
<p class="noon">Noon</p>
<p class="meem">Meem</p>
<p class="ghunnah">Ghunnah</p>
<button onclick="closePanels()">Close</button>
</div>

<!-- COMPASS -->
<div id="compassPanel" class="panel">
<h3>Qiblah Compass</h3>
<div id="compass">
 <div id="needle"></div>
</div>
<button onclick="closePanels()">Close</button>
</div>

<!-- FOOTER -->
<div class="footer">
 MADE BY MUBASHIR 😈🔥
</div>

<script src="app.js"></script>
</body>
</html>
