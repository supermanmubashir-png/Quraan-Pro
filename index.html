<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quraan Pro – Read, Listen & Learn Quran</title>

<meta property="og:title" content="Quraan Pro – Quran Reader App">
<meta name="twitter:title" content="Quraan Pro – Quran Reader App">
 <meta name="description" content="Quraan Pro is a modern Quran app with audio recitation, tafseer, bookmarks, tajweed colors, and prayer tools. Read, listen, and learn easily.">
  <meta property="og:description" content="Read and listen to the Holy Quran with tafseer, bookmarks, tajweed, and smart features in Quraan Pro.">

<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
 <link rel="icon" href="favicon.png">
</head>

<body>

<!-- OVERLAY -->
<div id="overlay" onclick="closePanels()"></div>

<!-- TOP BAR -->
<div class="top">
 <button onclick="toggleSidebar()">☰</button>
 <button onclick="toggleTajweed()">🧠</button>
 <button onclick="openGoto()">🎯</button>
 <button onclick="openSettings()">⚙</button>
 <button onclick="showLegend()">📖</button>
 <button onclick="getNamaz()">🕌</button>
 <button onclick="openCompass()">🧭</button>
 <button onclick="installApp()">📱</button>
<button onclick="openHelp()">❓ HELP</button>
 <button onclick="window.open('updates.html')">🆕 Updates</button>
</div>

<!-- SEARCH -->
<input placeholder="Search surah..." oninput="searchSurah(this.value)">

<!-- SIDEBAR -->
<div id="sidebar"></div>

<!-- MAIN CONTENT -->
<div id="content">
 <h2 style="text-align:center;">Select a Surah</h2>
</div>

<!-- SETTINGS PANEL -->
<div id="settings" class="panel">
<h3>Settings</h3>

<!-- AUDIO -->
<h4>Audio</h4>
<label>Reciter</label>
<select id="reciterSelect">
 <option value="ar.alafasy">Alafasy</option>
 <option value="ar.abdurrahmaansudais">Sudais</option>
</select>

<label>Speed</label>
<input type="range" min="0.5" max="2" step="0.25" id="speed">

<label>Pause Between Ayahs</label>
<input type="range" min="0" max="5" id="pause">

<label>Repeat Count</label>
<input type="number" min="1" max="10" id="repeat">

<!-- TRANSLATION -->
<h4>Translation</h4>
<select id="translationSelect">
 <option value="en.asad">Asad</option>
 <option value="en.sahih">Sahih</option>
 <option value="ur.jalandhry">Urdu</option>
</select>

<label>Show Translation</label>
<input type="checkbox" id="toggleTranslation" checked>

<!-- TAJWEED -->
<h4>Tajweed</h4>
<label>Enable</label>
<input type="checkbox" id="tajweedToggle" checked>

<label>Intensity</label>
<input type="range" min="1" max="5" id="tajweedIntensity">

<!-- UI -->
<h4>UI</h4>
<label>Theme</label>
Theme:
<select id="themeSelect">
<option value="theme-dark">Dark</option>
<option value="theme-light">Light</option>
<option value="theme-blue">Blue</option>
<option value="theme-green">Green</option>
<option value="theme-purple">Purple</option>
<option value="theme-gold">Gold</option>
</select>

<label>Arabic Font Size</label>
<input type="range" min="18" max="40" id="fontSize">

<!-- BOOKMARK -->
<h4>Progress</h4>
<button onclick="resume()">Resume Last</button>

<button onclick="closePanels()">Close</button>
</div>

<!-- GOTO PANEL -->
<div id="goto" class="panel">
<h3>Go To</h3>
Surah: <input id="suraInput"><br><br>
Ayah: <input id="ayahInput"><br><br>
<button onclick="goToAyah()">Go</button>
<button onclick="closePanels()">Close</button>
</div>

<!-- LEGEND -->
<div id="legend" class="panel">
<h3>Tajweed Legend</h3>
<p class="madd">Madd</p>
<p class="qalqala">Qalqalah</p>
<p class="ikhfa">Ikhfa</p>
<p class="idgham">Idgham</p>
<p class="iqlab">Iqlab</p>
<p class="noon">Noon</p>
<p class="meem">Meem</p>
<p class="ghunnah">Ghunnah</p>
<button onclick="closePanels()">Close</button>
</div>

<!-- COMPASS -->
<div id="compassPanel" class="panel">
<h3>Qiblah Compass</h3>
<div id="compass">
 <div id="needle"></div>
</div>
<button onclick="closePanels()">Close</button>
</div>

<!-- FOOTER -->
<div class="footer">
 MADE BY MUBASHIR 😈🔥
</div>

<script src="app.js"></script>
</body>
</html>
