<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quraan Pro</title>

<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.png">

<style>
/* ===== BASE ===== */
body{margin:0;font-family:sans-serif;background:#0f2027;color:white;}
.top{display:flex;flex-wrap:wrap;gap:6px;padding:10px;position:sticky;top:0;background:#0f2027;z-index:1000;}
button{padding:8px;border:none;border-radius:10px;background:#00e5ff;color:#000;cursor:pointer;}
input{width:95%;margin:10px;padding:10px;border-radius:10px;border:none;outline:none;}

/* ===== SIDEBAR ===== */
#sidebar{position:fixed;left:-260px;top:0;width:250px;height:100%;background:#111;overflow:auto;transition:.3s;z-index:2000;}
#sidebar.active{left:0;}
#sidebar div{padding:12px;border-bottom:1px solid #333;cursor:pointer;}
#sidebar div:hover{background:#00e5ff22;}

/* ===== AYAH ===== */
.ayah{margin:12px;padding:12px;background:#ffffff11;border-radius:12px;position:relative;}
.active{border:2px solid cyan;}
.arabic{font-size:24px;text-align:right;line-height:1.8}

/* ===== STAR (bookmark) ===== */
.star{position:absolute;top:10px;right:10px;font-size:18px;cursor:pointer;transition:.3s}
.star.active{color:gold;animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}

/* ===== TAJWEED COLORS ===== */
.madd{color:#00e5ff;}       /* Blue */
.qalqala{color:#ffd600;}    /* Yellow */
.ikhfa{color:#ab47bc;}      /* Purple */
.idgham{color:#ff9800;}     /* Orange */
.iqlab{color:#00e676;}      /* Green */
.noon{color:#ff4081;}       /* Pink */
.meem{color:#26c6da;}       /* Cyan */
.ghunnah{color:#ff1744;}    /* Red */
.silent{color:#777;}        /* Gray */

/* ===== PANELS + OVERLAY ===== */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9998}
.panel{position:fixed;top:10%;left:10%;width:80%;max-height:70%;overflow:auto;background:#111;padding:15px;border-radius:12px;display:none;z-index:9999}

/* ===== COMPASS ===== */
#compass{width:200px;height:200px;border:3px solid #fff;border-radius:50%;margin:auto;position:relative}
#needle{width:4px;height:90px;background:red;position:absolute;top:10px;left:50%;transform-origin:bottom}

/* ===== FOOTER ===== */
.footer{opacity:.7;text-align:center;padding:15px}
</style>
</head>

<body>

<div id="overlay" onclick="closePanels()"></div>

<div class="top">
 <button onclick="toggleSidebar()">☰</button>
 <button onclick="toggleTajweed()">🧠</button>
 <button onclick="openGoto()">🎯</button>
 <button onclick="openSettings()">⚙</button>
 <button onclick="showLegend()">📖</button>
 <button onclick="getNamaz()">🕌</button>
 <button onclick="openCompass()">🧭</button>
 <button onclick="installApp()">📱</button>
</div>

<input placeholder="Search..." oninput="search(this.value)">

<div id="sidebar"></div>
<div id="content"></div>

<!-- SETTINGS -->
<div id="settings" class="panel">
<h3>Settings</h3>
Reciter:
<select onchange="setReciter(this.value)">
 <option value="ar.alafasy">Alafasy</option>
 <option value="ar.abdurrahmaansudais">Sudais</option>
</select><br><br>

Translation:
<select onchange="setTranslation(this.value)">
 <option value="en.asad">Asad</option>
 <option value="en.sahih">Sahih</option>
 <option value="ur.jalandhry">Urdu</option>
</select><br><br>

<button onclick="resume()">Resume ⭐</button>
<button onclick="closePanels()">Close</button>
</div>

<!-- GOTO -->
<div id="goto" class="panel">
Surah: <input id="suraInput"><br><br>
Ayah: <input id="ayahInput"><br><br>
<button onclick="goToAyah()">Go</button>
<button onclick="closePanels()">Close</button>
</div>

<!-- LEGEND -->
<div id="legend" class="panel">
<h3>Tajweed Legend</h3>
<p class="madd">Madd (Blue)</p>
<p class="qalqala">Qalqalah (Yellow)</p>
<p class="ikhfa">Ikhfa (Purple)</p>
<p class="idgham">Idgham (Orange)</p>
<p class="iqlab">Iqlab (Green)</p>
<p class="noon">Noon (Pink)</p>
<p class="meem">Meem (Cyan)</p>
<p class="ghunnah">Ghunnah (Red)</p>
<p class="silent">Silent (Gray)</p>
<button onclick="closePanels()">Close</button>
</div>

<!-- COMPASS -->
<div id="compassPanel" class="panel">
<h3>Qiblah Compass</h3>
<div id="compass"><div id="needle"></div></div>
<button onclick="closePanels()">Close</button>
</div>

<script>
let Quran=[], currentSurah=null;
let audio=new Audio();
let currentIndex=-1, loop=false, cont=true;
let translation="en.asad", reciter="ar.alafasy";
let tajweedOn=true;
let deferredPrompt;

/* ===== PWA ===== */
window.addEventListener('beforeinstallprompt', e=>{
 e.preventDefault(); deferredPrompt=e;
});
function installApp(){ if(deferredPrompt) deferredPrompt.prompt(); }

/* ===== LOAD QURAN ===== */
async function loadQuran(){
 const r=await fetch("https://api.alquran.cloud/v1/quran/quran-uthmani");
 Quran=(await r.json()).data.surahs;
 renderSidebar(Quran);
}
function renderSidebar(list){
 sidebar.innerHTML=list.map(s=>`<div onclick="openSurah(${s.number});toggleSidebar()">${s.number}. ${s.englishName}</div>`).join("");
}
function toggleSidebar(){ sidebar.classList.toggle("active"); }

/* ===== TAJWEED (simple highlighter) ===== */
function tajweed(text){
 if(!tajweedOn) return text;
 return text
  .replace(/[اوي]/g,'<span class="madd">$&</span>')
  .replace(/[قطبجد]/g,'<span class="qalqala">$&</span>')
  .replace(/ن/g,'<span class="noon">ن</span>')
  .replace(/م/g,'<span class="meem">م</span>');
}

/* ===== OPEN SURAH ===== */
async function openSurah(n){
 currentSurah=Quran.find(s=>s.number===n);

 const t=await fetch(`https://api.alquran.cloud/v1/surah/${n}/${translation}`);
 const trans=(await t.json()).data.ayahs;

 let html="";
 currentSurah.ayahs.forEach((a,i)=>{
  html+=`
  <div class="ayah" id="a${i}">
   <div class="star" onclick="toggleStar(this,${n},${i})">⭐</div>

   <div>${i+1}</div>
   <div class="arabic">${tajweed(a.text)}</div>
   <div>${trans[i].text}</div>

   <div style="margin-top:8px">
     <button onclick="togglePlay(${i},this)">▶️</button>
     <button onclick="setLoop(${i})">🔁</button>
     <button onclick="setContinue(${i})">⏭</button>
   </div>
  </div>`;
 });
 content.innerHTML=html;
}

/* ===== PLAY / PAUSE ===== */
function togglePlay(i,btn){
 if(currentIndex===i && !audio.paused){
  audio.pause();
  btn.textContent="▶️";
  return;
 }
 currentIndex=i;
 highlight(i);

 const g=currentSurah.ayahs[i].number;
 audio.src=`https://cdn.islamic.network/quran/audio/128/${reciter}/${g}.mp3`;
 audio.play().catch(()=>alert("Tap again to allow audio"));

 document.querySelectorAll(".ayah button").forEach(b=>{
  if(b.textContent==="⏸") b.textContent="▶️";
 });
 btn.textContent="⏸";
}
function setLoop(i){ loop=true; cont=false; togglePlay(i, document.querySelector(`#a${i} button`)); }
function setContinue(i){ cont=true; loop=false; togglePlay(i, document.querySelector(`#a${i} button`)); }

audio.onended=()=>{
 if(loop) togglePlay(currentIndex, document.querySelector(`#a${currentIndex} button`));
 else if(cont){
  currentIndex++;
  if(currentIndex<currentSurah.ayahs.length){
    togglePlay(currentIndex, document.querySelector(`#a${currentIndex} button`));
  }
 }
};

/* ===== HIGHLIGHT ===== */
function highlight(i){
 document.querySelectorAll(".ayah").forEach(e=>e.classList.remove("active"));
 const el=document.getElementById("a"+i);
 if(el){ el.classList.add("active"); el.scrollIntoView({behavior:"smooth",block:"center"}); }
}

/* ===== BOOKMARK ===== */
function toggleStar(el,s,i){
 el.classList.toggle("active");
 localStorage.setItem("bm", JSON.stringify({s,i}));
}
function resume(){
 const b=JSON.parse(localStorage.getItem("bm"));
 if(b){ openSurah(b.s); setTimeout(()=>highlight(b.i),700); }
}

/* ===== SETTINGS ===== */
function openSettings(){ openPanel(settings); }
function setReciter(r){ reciter=r; }
function setTranslation(t){ translation=t; if(currentSurah) openSurah(currentSurah.number); }
function toggleTajweed(){ tajweedOn=!tajweedOn; if(currentSurah) openSurah(currentSurah.number); }

/* ===== PANELS ===== */
function openPanel(p){ overlay.style.display="block"; p.style.display="block"; }
function closePanels(){ overlay.style.display="none"; document.querySelectorAll(".panel").forEach(p=>p.style.display="none"); }

/* ===== GOTO ===== */
function openGoto(){ openPanel(goto); }
function goToAyah(){
 const s=parseInt(suraInput.value);
 const a=parseInt(ayahInput.value)-1;
 openSurah(s);
 setTimeout(()=>highlight(a),700);
}

/* ===== SEARCH ===== */
function search(q){
 q=q.toLowerCase();
 renderSidebar(Quran.filter(s=>s.englishName.toLowerCase().includes(q)));
}

/* ===== NAMAZ (Hanafi) ===== */
async function getNamaz(){
 const r=await fetch("https://api.aladhan.com/v1/timingsByCity?city=Delhi&country=India&method=1&school=1");
 const d=(await r.json()).data.timings;
 alert(`Fajr:${d.Fajr}\nDhuhr:${d.Dhuhr}\nAsr:${d.Asr}\nMaghrib:${d.Maghrib}\nIsha:${d.Isha}`);
}

/* ===== COMPASS ===== */
let qiblaAngle=0;
function openCompass(){ openPanel(compassPanel); startCompass(); }
function startCompass(){
 navigator.geolocation.getCurrentPosition(pos=>{
  const lat=pos.coords.latitude*Math.PI/180;
  const lon=pos.coords.longitude*Math.PI/180;
  const kaabaLat=21.4225*Math.PI/180;
  const kaabaLon=39.8262*Math.PI/180;

  const dLon=kaabaLon-lon;
  const y=Math.sin(dLon);
  const x=Math.cos(lat)*Math.tan(kaabaLat)-Math.sin(lat)*Math.cos(dLon);
  qiblaAngle=(Math.atan2(y,x)*180/Math.PI);
 });

 window.addEventListener("deviceorientationabsolute", e=>{
  const heading=e.alpha;
  if(heading!=null){
   needle.style.transform=`rotate(${heading-qiblaAngle}deg)`;
  }
 });
}

/* ===== INIT ===== */
loadQuran();
</script>

<div class="footer">MADE BY MUBASHIR 😈🔥</div>

</body>
</html>
